<div class="container">

  <app-product-search (searchChange)="onSearchName($event)" (categoryChange)="onSearchCategory($event)"></app-product-search>
  <div class="product-list">
    <div class="list-header">
      <span>Name</span>
      <span>Category</span>
      <span>Price</span>
      <span>Stock</span>
      <span>Status</span>
      <span class="actions-col"></span>
    </div>
  
    @if (loading) {
      <div class="loading-state">Loading...</div>
    } @else {
      @for (product of products; track product._id) {
          <app-product-card [product]="product"></app-product-card>
      } @empty {
          <div class="empty-state">No products found.</div>
      }
    }
  
    <div class="pagination">
      <button (click)="goToPage(currentPage - 1)" [disabled]="currentPage === 1">‹ Prev</button>
  
      <span class="page-info">Page {{ currentPage }} of {{ getTotalPages() }}</span>
  
      <button (click)="goToPage(currentPage + 1)" [disabled]="currentPage === getTotalPages()">Next ›</button>
    </div>
  
  </div>
</div>
